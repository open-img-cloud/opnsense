name: probe (exploration, not a release)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nics: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - name: Install QEMU
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf
          sudo chmod 0666 /dev/kvm
      - name: Fetch and verify the official nano image
        run: |
          set -euo pipefail
          base=https://pkg.opnsense.org/releases/26.7
          curl -fsSLO $base/OPNsense-26.7-nano-amd64.img.bz2
          curl -fsSL $base/OPNsense-26.7-nano-amd64.img.sig | openssl base64 -d > nano.sig
          bunzip2 OPNsense-26.7-nano-amd64.img.bz2
          openssl dgst -sha256 -verify keys/OPNsense-26.7.pub -signature nano.sig OPNsense-26.7-nano-amd64.img
          qemu-img convert -O qcow2 OPNsense-26.7-nano-amd64.img nano.qcow2
          qemu-img resize nano.qcow2 10G
      - name: Boot (${{ matrix.nics }} NIC) and observe
        run: |
          set -u
          nets=(-netdev user,id=n0,hostfwd=tcp::8443-:443,hostfwd=tcp::2222-:22 -device virtio-net-pci,netdev=n0)
          [ "${{ matrix.nics }}" = 2 ] && nets+=(-netdev user,id=n1,net=10.9.0.0/24 -device virtio-net-pci,netdev=n1)
          qemu-system-x86_64 -accel kvm -cpu host -smp 2 -m 2048 -nographic \
            -drive file=nano.qcow2,if=virtio "${nets[@]}" \
            -serial file:console.log -monitor none -display none &
          pid=$!
          for i in $(seq 1 60); do
            sleep 10
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 https://127.0.0.1:8443/ || true)
            echo "t=$((i*10))s https=$code ssh=$(timeout 3 bash -c 'head -c 20 </dev/tcp/127.0.0.1/2222' 2>/dev/null | tr -dc '[:print:]' || true)"
            grep -q "login:" console.log && [ $i -gt 18 ] && break
          done
          kill $pid
      - name: Console
        if: always()
        run: sed 's/\x1b\[[0-9;]*[A-Za-z]//g' console.log | tail -150
