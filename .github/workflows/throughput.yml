name: Throughput (Infomaniak)

# Manual: iperf3 throughput of the published Debian 13, FreeBSD 15 and
# OPNsense images on Infomaniak (virtio-net), host and routed through
# OPNsense. See tests/throughput.sh.
on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Infomaniak region'
        default: 'dc3-a'
      flavor:
        description: 'Flavor of every VM'
        default: 'a2-ram4-disk20-perf1'
      scope:
        description: 'all (Debian, FreeBSD 15, OPNsense) or opnsense (OPNsense only, same-host case)'
        default: 'all'
      run_id:
        description: 'Optional release.yml run (publish=false) whose OPNsense build to test instead of the published image'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  iperf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: OpenStack client
        run: pip install -q python-openstackclient
      - name: Unpublished OPNsense build
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}/artifacts" \
            -q '[.artifacts[] | select(.name | startswith("freebsd-image-") | not) | select(.name | startswith("opnsense"))][0].name')
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n "$name" -D "$RUNNER_TEMP/art"
          echo "OPN_IMAGE_FILE=$(ls "$RUNNER_TEMP"/art/*.qcow2 | head -1)" >> "$GITHUB_ENV"
      - name: Measure
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_REGION_NAME: ${{ inputs.region }}
          OS_AUTH_TYPE: v3applicationcredential
          OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.OS_APPLICATION_CREDENTIAL_ID }}
          OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.OS_APPLICATION_CREDENTIAL_SECRET }}
          OS_IDENTITY_API_VERSION: '3'
          OS_INTERFACE: public
          FLAVOR: ${{ inputs.flavor }}
          SCOPE: ${{ inputs.scope }}
        run: tests/throughput.sh
