name: Build & publish image

# A v<VERSION> tag (auto-release.yml, on merging the VERSION bump) builds,
# signs, boot-tests and publishes. Dispatch with publish=false builds the
# image and keeps it as an artifact for test.yml and smoke.yml.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the OPNsense version (e.g. 26.7.9_3); otherwise derived from the tag, falling back to VERSION'
        required: false
      publish:
        description: 'If false, skip upload + CF purge (dry-run validation)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # cosign keyless via GitHub OIDC

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            v="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v=$(tr -d '[:space:]' < VERSION)
          fi
          if [[ ! "$v" =~ ^[0-9]{2}\.[17](\.[0-9]+)?(_[0-9]+)?$ ]]; then
            echo "::error::version '$v' is not an OPNsense release (e.g. 26.7.9)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-version
    name: OPNsense
    uses: open-img-cloud/.github/.github/workflows/build-freebsd-image.yml@main
    with:
      os_name: opnsense
      version: ${{ needs.resolve-version.outputs.version }}
      output_filename: 'opnsense-{version}-x86_64.qcow2'
      build_script: build/build.sh
      # Dedicated FreeBSD runner (runner group freebsd-builder).
      build_runner: '["self-hosted","freebsd","amd64"]'
      runtime_smoke_login_user: root
      runtime_smoke_contract: appliance
      publish: ${{ inputs.publish == true || github.event_name == 'push' }}
      sync_latest: true
    secrets: inherit
